<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>清简</title><link rel="stylesheet" href="ui.css"><body class="popup"><header class="brand"><img src="icons/qingjian-48.png" width="42" height="42" alt=""><div><h1>清简</h1><small>中文与英文，自然输入</small></div></header><p>拼音显示候选，空格上屏，数字选词；英文照常打。</p><button id="site" class="primary">在此网站启用</button><button id="exclude-site">在此网站禁用</button><label title="由你授权访问所有普通网页；不上传输入内容"><input id="all-sites" type="checkbox"> 所有网站自动启用（需授权）</label><label><input id="auto" type="checkbox"> 自动混输</label><label><input id="ai" type="checkbox"> 本地 AI 辅助</label><label><input id="fuzzy" type="checkbox"> 模糊拼音（平翘舌、前后鼻音、n/l）</label><label><input id="learning" type="checkbox"> 学习选词习惯（可关闭）</label><button id="clear-learning">清除学习记录</button><p id="native">正在检查本地助手…</p><p>选中拼音 → <kbd>Ctrl+Shift+Z</kbd><br>也可右键 → 清简转换</p><button id="keys">快捷键设置</button><p id="status" role="status"></p><small>无需云 API · 不改系统输入法</small><script src="popup.js"></script></body></html>
